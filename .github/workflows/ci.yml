name: ECLYPSA AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Compile Native Go Subsystem
        run: |
          mkdir -p bin
          go build -o bin/recon engine/recon.go

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          if [ -d "tests" ]; then
            python -m unittest discover -s tests -p "test_*.py"
          else
            echo "No tests directory found, skipping."
          fi
