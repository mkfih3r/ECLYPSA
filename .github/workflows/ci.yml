name: ECLYPSA AI CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v3

    # Step 1: Set up Go environment and build core binary
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build Go Recon Engine
      run: |
        mkdir -p bin
        go build -o bin/recon engine/recon.go

    # Step 2: Set up Python environment and run unit tests
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Python Unit Tests
      run: |
        python -m unittest discover -s tests
