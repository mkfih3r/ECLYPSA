version: '3.8'

services:
  eclypsa-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eclypsa_core
    ports:
      - "8080:8080"
    environment:
      - ECLYPSA_HOST=0.0.0.0
      - ECLYPSA_PORT=8080
      - OLLAMA_HOST=http://ollama_engine:11434
    depends_on:
      - ollama_engine
    restart: unless-stopped
    networks:
      - eclypsa_net

  ollama_engine:
    image: ollama/ollama:latest
    container_name: eclypsa_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - eclypsa_net

networks:
  eclypsa_net:
    driver: bridge

volumes:
  ollama_data:
